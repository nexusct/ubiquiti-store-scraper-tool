# ==========================================================================
# Nexus Communications Technology - Pre-commit Security Hooks
# Last updated: 2026-08-17
# ==========================================================================
# SETUP (once per machine):
#   pip install pre-commit
#
# SETUP (once per repo):
#   cd <repo>
#   pre-commit install
#
# Manual scan (before important pushes):
#   pre-commit run --all-files
# ==========================================================================

repos:
  # ---- Secret detection ----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets (belt + suspenders)
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|yarn\.lock|pnpm-lock\.yaml

  # ---- Nexus-specific forbidden strings ----
  - repo: local
    hooks:
      - id: nexus-forbidden-patterns
        name: Block Nexus-known-bad patterns
        entry: |
          bash -c '
          FAIL=0
          # Known-bad admin password from past incidents
          if git diff --cached | grep -qE "nexus2026"; then
            echo "❌ BLOCKED: commit contains a retired admin password string."
            FAIL=1
          fi
          # Dealer cost marker (pricing-engine.js dealer data)
          if git diff --cached | grep -qE "const MARGIN = 0\.25"; then
            echo "❌ BLOCKED: commit contains internal margin constant. Use NexusPricing.init()."
            FAIL=1
          fi
          # Google Maps API key pattern (exclude .example.* and .template.* files)
          if git diff --cached --name-only | grep -vE "\.(example|template)\." | \
             xargs -I{} git diff --cached -- {} 2>/dev/null | grep -qE "AIza[0-9A-Za-z_-]{35}"; then
            echo "❌ BLOCKED: commit contains a Google API key. Move to environment variable or gitignored config file."
            FAIL=1
          fi
          # AWS access keys
          if git diff --cached | grep -qE "AKIA[0-9A-Z]{16}"; then
            echo "❌ BLOCKED: commit contains AWS access key."
            FAIL=1
          fi
          # Private keys
          if git diff --cached | grep -qE "BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY"; then
            echo "❌ BLOCKED: commit contains a private key."
            FAIL=1
          fi
          # Stripe API keys
          if git diff --cached | grep -qE "(sk|pk)_(test|live)_[0-9A-Za-z]{24,}"; then
            echo "❌ BLOCKED: commit contains a Stripe API key."
            FAIL=1
          fi
          # Generic high-entropy strings (potential secrets)
          if git diff --cached | grep -qE "(api[_-]?key|secret|password|token)[[:space:]]*[=:][[:space:]]*['\''\"'][A-Za-z0-9+/=]{32,}['\''\"']"; then
            echo "❌ BLOCKED: commit contains what appears to be a hardcoded secret."
            FAIL=1
          fi
          exit $FAIL
          '
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ---- File hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
